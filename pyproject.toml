[project]
name = "cairn"
version = "0.1.0"
description = "Linked notes for developers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.3,<5.2",
    "fastapi>=0.115.5,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "gunicorn>=23.0.0,<24.0",
    "psycopg[binary]>=3.2.3,<3.3",
    "pydantic>=2.9.2,<3.0",
    "django-allauth>=65.2.0,<66.0",
    "markdown-it-py>=3.0.0,<4.0",
    "nh3>=0.2.18,<0.3",
    "selectolax>=0.3.27,<0.4",
    "pygments>=2.18.0,<3.0",
    "whitenoise>=6.8.2,<7.0",
    "django-otp>=1.5.4,<2.0",
    "python-dotenv>=1.0.1,<2.0",
    "requests>=2.32.3,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0",
    "pytest-django>=4.9.0,<5.0",
    "ruff>=0.8.0,<1.0",
    "httpx>=0.27.2,<0.28",
    "pre-commit>=4.0.1,<5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings/*.py" = ["F403", "F405"]
"backend/config/asgi.py" = ["E402"]
"backend/api/**/*.py" = ["B008"]
"**/migrations/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "api", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-markers -ra"
