{% extends "admin/base.html" %}

{% block title %}{{ title }} | Cairn Admin{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
  body, input, select, textarea, button {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  code, pre, .vTextField, .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #header {
    background: #141413;
    color: #faf9f5;
  }
  #branding h1, #branding h1 a:link, #branding h1 a:visited {
    color: #faf9f5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 600;
  }
</style>
{% endblock %}

{% block branding %}
<div id="site-name"><a href="{% url 'admin:index' %}">cairn // admin</a></div>
{% endblock %}
