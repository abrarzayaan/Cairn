name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devbook_test
          POSTGRES_USER: devbook
          POSTGRES_PASSWORD: devbook_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: test-secret-key-ci-only
      DATABASE_URL: postgres://devbook:devbook_password@localhost:5432/devbook_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Migration check
        run: |
          python backend/manage.py makemigrations --check --dry-run

      - name: Run tests
        run: |
          pytest
