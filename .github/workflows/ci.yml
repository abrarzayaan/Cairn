name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cairn_test
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: test-secret-key-ci-only
      DATABASE_URL: postgres://cairn:cairn_password@localhost:5432/cairn_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Migration check
        run: |
          python backend/manage.py makemigrations --check --dry-run

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip-audit --strict --progress-spinner off

      - name: Security test matrix (private-leak & XSS)
        run: |
          pytest -vv backend/tests/security/

      - name: Full test suite
        run: |
          pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency audit (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit
