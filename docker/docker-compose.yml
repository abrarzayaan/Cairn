services:
  db:
    image: postgres:16-alpine
    container_name: devbook_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: devbook
      POSTGRES_USER: devbook
      POSTGRES_PASSWORD: devbook_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devbook -d devbook"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devbook_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: devbook_web
    restart: unless-stopped
    command: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -w 3 -b 0.0.0.0:8000
    volumes:
      - ../backend:/app/backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
